name: Collect and publish

# Runs on GitHub's infrastructure, so the public dashboard keeps updating with
# the laptop asleep, shut, or switched off.
#
# Timing note: cron here is BEST EFFORT. GitHub queues scheduled workflows and
# under load they can start 5-20 minutes late, so treat "*/5" as "roughly every
# 5-10 minutes", not a guarantee. The published page always states its own age,
# so a late run shows up honestly rather than passing as current.
on:
  schedule:
    # 03:45-10:05 UTC == 09:15-15:35 IST, Mon-Fri. The job re-checks IST market
    # hours itself and exits in seconds when closed.
    # NOTE: */30 keeps a PRIVATE repo inside the 2,000 free minutes/month
    # (~1,525 used). A 5-minute cadence costs ~9,150 min/month, which is free
    # only on a PUBLIC repo. Flip to "*/5 3-10 * * 1-5" once the repo is public.
    # Deliberately NOT on :00/:30. Those are the most contended minutes on
    # GitHub's scheduler and the runs that got dropped were all on them.
    - cron: "7,22,37,52 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the market is closed"
        type: boolean
        default: false

concurrency:
  # Never let a slow run overlap the next one -- two collectors would compete
  # for the same Kite rate limit and both would crawl.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect, render and deploy
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_cycle.py ${{ inputs.force && '--force' || '' }}

      - name: Report a dead Kite session
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # The overwhelmingly likely cause of a red run is the overnight token
          # expiry, so say so rather than leaving a silent failed build.
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d parse_mode=HTML \
              --data-urlencode text="<b>Delta Yield — cloud run failed</b>
          The scheduled collection did not complete. Most likely the Kite token expired overnight.
          Sign in on your Mac and run: ./push_token.sh
          Run log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          fi

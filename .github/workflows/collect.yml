name: Collect and publish

# ONE long-running job per session that loops internally, instead of asking
# cron to fire 25 separate times.
#
# Why: GitHub queues scheduled workflows at low priority and drops them under
# load. On a nominal 30-minute schedule the observed gaps were 18, 37, 50 and
# then 76 minutes, with two runs never starting at all. Cron is only asked to
# start the job now, not to keep time, so a dropped trigger costs one restart
# rather than one refresh.
#
# Free because the repository is public: ~6 hours/day of runner time would blow
# through the 2,000 free minutes on a private repo, but public repos have
# unlimited Actions minutes.
on:
  schedule:
    # 03:40 UTC == 09:10 IST, five minutes before the open.
    - cron: "40 3 * * 1-5"
    # Restarts every two hours. Two purposes: if the first trigger was dropped
    # or the job died, this revives it; and because a running job holds the
    # secret values it started with, a restart is also how a Kite token you
    # refreshed mid-morning gets picked up.
    - cron: "40 5 * * 1-5"
    - cron: "40 7 * * 1-5"
    - cron: "40 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run one cycle even when the market is closed"
        type: boolean
        default: false

concurrency:
  group: collect
  # A scheduled restart should REPLACE the running job, otherwise it would be
  # skipped and the job would keep using stale secrets all day.
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # Market is 09:15-15:30 IST. A job starting at 09:10 needs ~6h20m; the
    # ceiling for a GitHub-hosted runner is 6h, and the two-hourly restarts
    # cover the remainder.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and publish on a loop
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 5 minutes is the floor, set by two independent limits: a full sweep
          # takes ~155s against Kite's 1 req/s quote limit, and Vercel's Hobby
          # plan allows 100 deployments/day (5 min = 75/day, 3 min = 125/day).
          LOOP_INTERVAL_SECONDS: "300"
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python cloud_cycle.py --force
          else
            python cloud_cycle.py --loop
          fi

      - name: Report a failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              -d parse_mode=HTML \
              --data-urlencode text="<b>Delta Yield — cloud run failed</b>
          Collection stopped. Most likely the Kite token expired overnight.
          Sign in on your Mac (the token is relayed automatically), or run ./push_token.sh
          Log: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          fi
